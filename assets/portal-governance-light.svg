<svg xmlns="http://www.w3.org/2000/svg" width="900" height="104" viewBox="0 0 900 104" role="img" aria-labelledby="title desc">
<title id="title">AI Governance — OpenExecution</title><desc id="desc">An original animated constellation. Decorative motion pauses when reduced motion is preferred. Navigation is provided by the surrounding link.</desc>
<style>
text{font-family:Arial,Helvetica,sans-serif} .mono{font-family:Consolas,Menlo,monospace}
@keyframes orbit{to{transform:rotate(360deg)}}
@keyframes breathe{0%,100%{opacity:.36}50%{opacity:.8}}
@keyframes signal{to{stroke-dashoffset:-560}}
.spin{animation:orbit 55s linear infinite}.reverse{animation:orbit 88s linear infinite reverse}
.breathe{animation:breathe 8s ease-in-out infinite}.signal{animation:signal 18s linear infinite}

@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs><linearGradient id="bg"><stop stop-color="#f5f8fc"/><stop offset="1" stop-color="#ffffff"/></linearGradient></defs>
