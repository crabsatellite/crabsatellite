<svg xmlns="http://www.w3.org/2000/svg" width="900" height="104" viewBox="0 0 900 104" role="img" aria-labelledby="title desc">
<title id="title">Research — Crab Research</title><desc id="desc">An original animated constellation. Decorative motion pauses when reduced motion is preferred. Navigation is provided by the surrounding link.</desc>
<style>
text{font-family:Arial,Helvetica,sans-serif} .mono{font-family:Consolas,Menlo,monospace}
@keyframes orbit{to{transform:rotate(360deg)}}
@keyframes breathe{0%,100%{opacity:.36}50%{opacity:.8}}
@keyframes signal{to{stroke-dashoffset:-560}}
.spin{animation:orbit 55s linear infinite}.reverse{animation:orbit 88s linear infinite reverse}
.breathe{animation:breathe 8s ease-in-out infinite}.signal{animation:signal 18s linear infinite}

@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs><linearGradient id="bg"><stop stop-color="#0b1321"/><stop offset="1" stop-color="#090f18"/></linearGradient></defs>
<rect x=".5" y=".5" width="899" height="103" rx="9" fill="url(#bg)" stroke="#28344a"/>
<path d="M24 32V72" stroke="#80b8ff" opacity=".7"/>
<text class="mono" x="42" y="58" font-size="13" fill="#80b8ff">01</text>
<text x="88" y="64" font-size="30" fill="#e4ebf5" letter-spacing=".3">Research</text>
<g transform="translate(595 53)"><g class="spin" fill="none" stroke="#80b8ff" stroke-width=".75"><ellipse rx="44" ry="15"/><ellipse rx="44" ry="15" transform="rotate(60)"/><ellipse rx="44" ry="15" transform="rotate(120)"/></g><circle r="3" fill="#80b8ff"/></g>
<text class="mono" x="830" y="58" font-size="14" text-anchor="end" fill="#9daec3">Crab Research</text>
<path d="M852 59l12-12m-11 0h11v11" stroke="#80b8ff" stroke-width="1.3" fill="none"/></svg>
