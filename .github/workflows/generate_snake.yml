name: Profile visuals

on:
  push:
    branches: [main]
    paths: ['README.md', 'data/profile.json', 'assets/constellation.svg', 'assets/beach.svg', 'assets/portal-*.svg', '.github/scripts/generate-profile.mjs', '.github/workflows/generate_snake.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: node .github/scripts/generate-profile.mjs --check
